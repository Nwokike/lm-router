[project]
name = "lm-router"
version = "1.0.0"
description = "LM Router — chat with free models through your own local gateway. OpenAI compatible, no API key; the gateway runs on your device and messages go to third-party providers."
readme = "README.md"
authors = [
    { name = "Nwokike", email = "onyeka@kiri.ng" }
]

requires-python = ">=3.14,<3.15"
dependencies = [
    "flet>=1.0.1",
    "flet-ads>=1.0.1",
    "kani[mcp,openai]>=1.10.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.0",
    "flet-desktop>=1.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.flet]
org = "ng.kiri"
product = "LM Router"
company = "Kiri Research Labs"
build_number = 1

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0a0a0a"

# Cold start shows a message instead of a blank screen while the gateway
# spawns (Sherlock/DDGS shape; distinct from the banned legacy
# [tool.flet.app.boot_screen] key pinned by test_version_sync).
[tool.flet.boot_screen]
name = "flet"
[tool.flet.boot_screen.flet]
startup_message = "Starting LM Router..."

[tool.flet.deep_linking]
scheme = "lmrouter"
host = "app"

[tool.flet.android]
bundle_id = "ng.kiri.lmrouter"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~4946644229"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

# flet_cli defaults jvmargs to -Xmx8G which OOMs on 7 GB CI runners; merged
# over defaults, user values win (verified in flet_cli build_base).
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"

# Ship runtime code only (app_files implies cleanup.app, verified in flet_cli).
# Globs run INSIDE the packaged app dir (src/), so repo-root dirs (tests/ etc.)
# are already outside the package — no app_files entries needed.
[tool.flet.cleanup]
app = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]
strict_markers = true
strict_config = true
filterwarnings = [
    # Owner rule: NEVER suppress/ignore warnings. Any warning raised by OUR
    # code (module-scoped below) escalates to a hard error so it must be
    # fixed. Third-party warnings are left at default — they stay visible in
    # pytest's warnings summary on every run, never ignored, but cannot
    # brick the suite for code we don't own.
    "error:::^(services|screens|components|core|state|tests)(\\.|$)|^(app_shell|main)$",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# COM812 deliberately omitted: ruff's formatter already enforces trailing
# commas on split lines, and the rule conflicts with it (ruff warning).
select = ["E", "F", "W", "I", "UP", "S", "RUF", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design; stub excepts are intentional; dummy secrets appear
# in security-test fixtures on purpose.
"tests/*" = ["S101", "S105", "S110", "S112"]
# Prompt copy: line breaks are part of the text the model reads.
"src/services/router_guide.py" = ["E501"]
