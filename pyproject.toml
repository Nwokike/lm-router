[project]
name = "lm-router"
version = "1.1.0"
description = "LM Router — chat with free models through your own local gateway. OpenAI compatible, no API key; the gateway runs on your device and messages go to third-party providers."
readme = "README.md"
authors = [
    { name = "Nwokike", email = "onyeka@kiri.ng" }
]

requires-python = ">=3.14,<3.15"
dependencies = [
    "flet>=1.0.3",
    "flet-ads>=1.0.3",
    "kani[mcp,openai]>=1.10.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.3",
    "flet-desktop>=1.0.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.flet]
org = "ng.kiri"
product = "LM Router"
company = "Kiri Research Labs"
build_number = 1

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0a0a0a"

[tool.flet.boot_screen]
name = "flet"
[tool.flet.boot_screen.flet]
startup_message = "Starting LM Router..."

[tool.flet.deep_linking]
scheme = "lmrouter"
host = "app"

[tool.flet.android]
bundle_id = "ng.kiri.lmrouter"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~4946644229"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

# flet_cli defaults jvmargs to -Xmx8G which OOMs on 7 GB CI runners; merged
# over defaults, user values win (verified in flet_cli build_base).
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.cleanup]
app = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]
strict_markers = true
strict_config = true
filterwarnings = [
    "error:::^(services|screens|components|core|state|tests)(\\.|$)|^(app_shell|main)$",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "RUF", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S110", "S112"]
"src/services/router_guide.py" = ["E501"]
