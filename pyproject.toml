[project]
name = "lm-router"
version = "1.2.0"
description = "LM Router — an OpenAI-compatible LLM gateway that runs on your device. Free models, one-tap model probes, shareable URL; requests exit from your IP to third-party providers."
readme = "README.md"
authors = [
    { name = "Nwokike", email = "onyeka@kiri.ng" }
]

requires-python = ">=3.15,<3.16"
dependencies = [
    "flet>=1.1.2",
    "flet-ads>=1.1.2",
    "flet-notifications>=1.1.2",
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
    "flet-desktop>=1.1.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.flet]
org = "ng.kiri"
product = "LM Router"
company = "Kiri Research Labs"
build_number = 3

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0a0a0a"

[tool.flet.boot_screen]
name = "flet"
[tool.flet.boot_screen.flet]
startup_message = "Starting LM Router..."

[tool.flet.deep_linking]
scheme = "lmrouter"
host = "app"

[tool.flet.android]
legacy_packaging = true
bundle_id = "ng.kiri.lmrouter"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~4946644229"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.POST_NOTIFICATIONS" = true

[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService"]
exported = false
foregroundServiceType = "specialUse"

[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService".property]
"android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" = "LM Router keeps its local LLM gateway alive in the background"

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

# flet_cli defaults jvmargs to -Xmx8G which OOMs on 7 GB CI runners; merged
# over defaults, user values win (verified in flet_cli build_base).
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.cleanup]
app = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]
strict_markers = true
strict_config = true
filterwarnings = [
    "error:::^(services|screens|components|core|state|tests)(\\.|$)|^(app_shell|main)$",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "RUF", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S110", "S112"]
