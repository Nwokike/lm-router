[project]
name = "lm-router"
version = "0.1.0"
description = "LM Router — chat with free models through your own local gateway. OpenAI compatible, no API key; the gateway runs on your device and messages go to third-party providers."
readme = "README.md"
authors = [
    { name = "Nwokike", email = "onyeka@kiri.ng" }
]
# Pin the interpreter band: a flet-cli/python-build manifest bump must never
# silently switch the bundled runtime to 3.15 (bump deliberately after testing).
requires-python = ">=3.14,<3.15"
dependencies = [
    # The only three. Everything else the app needs is already a
    # sub-dependency of these, and importing one directly is not free:
    #   httpx, httpx-sse, jsonschema  <- mcp (via kani[mcp])
    #   pydantic, tiktoken            <- kani
    #   cryptography                  <- pyjwt[crypto], via mcp
    "flet>=1.0.1",
    "flet-ads>=1.0.1",
    "kani[mcp,openai]>=1.10.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.0",
    "flet-desktop>=1.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

# Keys verified against flet_cli 1.0.0 source. Dead keys deliberately omitted:
# android.manifest_application and android.min_sdk_version are never read by
# flet_cli, and Android permits cleartext to 127.0.0.1 by default, so the
# local gateway needs no manifest override. Do not "restore" them.
[tool.flet]
org = "ng.kiri"
product = "LM Router"
company = "Kiri Research Labs"
build_number = 1
# Brand background + adaptive icon fill. Note: src/assets/icon.svg is NOT
# consumed by flet-cli (it filters .svg as incompatible); icon.png is the
# build source of truth — keep the svg only as a design master.
icon_background = "#0a0a0a"

[tool.flet.app]
path = "src"

# [tool.flet.app.boot_screen] startup_message was DEAD config: flet-cli
# 1.0.0's _resolve_boot_screen() only reads [tool.flet.boot_screen] / per-
# platform overrides, so it silently did nothing. Do not restore it.

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0a0a0a"

[tool.flet.deep_linking]
scheme = "lmrouter"
host = "app"

[tool.flet.android]
bundle_id = "ng.kiri.lmrouter"
# No target_arch restriction: CI builds with --split-per-abi, so every
# Python-supported ABI ships as its own small APK (never one fat APK).
adaptive_icon_background = "#0a0a0a"

[tool.flet.android.meta_data]
# ⚠️ GOOGLE TEST AdMob ID — PRODUCTION IDs NOT SET YET ⚠️
#
# We are deliberately shipping with Google's public TEST ad units while the
# Play Store listing is pending. Two consequences you must not forget:
#   1. These test units serve test ads and pay nothing.
#   2. Before the REAL v1.0.0 Play Store release, swap this App ID and the
#      banner/interstitial unit IDs in src/core/constants.py to production,
#      then restore the hard-fail branch in
#      .github/workflows/build-all.yml (the "AdMob release-ID guard" step,
#      currently relaxed to a warning on purpose).
# Search for 3940256099942544 in this file and src/core/constants.py.
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-3940256099942544~3347511713"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.flet.android.signing]
# Presence of key_store flips on signing; passwords come from env/CLI only
# (FLET_ANDROID_SIGNING_KEY_STORE / _KEY_STORE_PASSWORD / _KEY_PASSWORD).
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

# flet_cli defaults jvmargs to -Xmx8G which OOMs on 7 GB CI runners; merged
# over defaults, user values win (verified in flet_cli build_base).
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"

# Ship runtime code only (app_files implies cleanup.app, verified in flet_cli).
# Globs run INSIDE the packaged app dir (src/), so repo-root dirs (tests/ etc.)
# are already outside the package — no app_files entries needed.
[tool.flet.cleanup]
app = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# COM812 deliberately omitted: ruff's formatter already enforces trailing
# commas on split lines, and the rule conflicts with it (ruff warning).
select = ["E", "F", "W", "I", "UP", "S", "RUF", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design; stub excepts are intentional; dummy secrets appear
# in security-test fixtures on purpose.
"tests/*" = ["S101", "S105", "S110", "S112"]
# Prints ARE the CLI interface for scripts (progress + errors to stdout).
"scripts/*" = ["T201"]
